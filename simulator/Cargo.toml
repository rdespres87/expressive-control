[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[dependencies]
expressive-core = { path = "../core" }
theremin = { path = "../instruments/theremin" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
midir = "0.9"
serialport = "4.3.0"
postcard = { version = "1.0.8", features = ["use-std"] }
slint = "1.8.0"

[build-dependencies]
slint-build = "1.8.0"
