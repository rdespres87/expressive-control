[package]
name = "expressive-theremin"
version = "0.1.0"
authors = ["Romuald Despres <rdespres87@users.noreply.github.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "expressive-theremin"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors



[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
esp-idf-hal = "0.47"
esp-idf-sys = "0.38"
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
expressive-core = { path = "../../core" }
theremin = { path = "../../instruments/theremin" }
vl53l4cd = "0.4.0"
embedded-hal-bus = "0.3"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embassy-futures = "0.1.1"

# UART Protocol Dependencies
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0", default-features = false }
cobs = { version = "0.2.3", default-features = false }
heapless = "0.8.0"

[build-dependencies]
embuild = "0.33.5"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_tinyusb", version = "*" }
