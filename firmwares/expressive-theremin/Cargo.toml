[package]
name = "expressive-theremin"
version = "0.1.0"
authors = ["Romuald Despres <rdespres87@users.noreply.github.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "expressive-theremin"

[features]
# Base firmware modes
default = ["single-screen"]
single-screen = []
master = []
slave = []

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
esp-idf-hal = "0.47"
esp-idf-sys = "0.38"
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
expressive-core = { path = "../../core" }
theremin = { path = "../../instruments/theremin" }
heapless = "0.9"
vl53l4cd = "0.4.0"
embedded-hal-bus = "0.3"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embassy-futures = "0.1.1"

# UART Protocol Dependencies
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.0", default-features = false }
cobs = { version = "0.2.3", default-features = false }

# Slint in its MCU flavour. The firmware itself is `std` (ESP-IDF), but Slint's own
# `std` feature must stay OFF: it enables `fontique` (system fonts) -> `memmap2`,
# which calls `mmap`/`madvise`, unavailable on `xtensa-esp32s3-espidf`.
# - `renderer-software`: only renderer usable without a GPU/OpenGL.
# - `unsafe-single-threaded`: required by Slint when `std` is off; all Slint calls
#   must therefore stay on the UI thread.
# - `libm`: float math without Slint's `std`.
# There is NO `backend-esp32` feature in the Rust crate (it only exists in the C++
# ESP-IDF component); the display is driven by LovyanGFX via `lgfx-rs`.
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "renderer-software", "unsafe-single-threaded", "libm"] }


[build-dependencies]
embuild = "0.33.5"
slint-build = "1.18.1"

[[package.metadata.esp-idf-sys.extra_components]]
# Pinned to 1.x: 2.x breaks the headers expected by esp-idf-sys bindings and the
# `tinyusb_config_t` layout mirrored by `TinyUsbConfig` in src/main.rs.
remote_component = { name = "espressif/esp_tinyusb", version = "^1.4" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
