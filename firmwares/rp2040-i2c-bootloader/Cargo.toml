[package]
name = "rp2040-i2c-bootloader"
version = "0.1.0"
edition = "2021"
description = "RP2040-Zero I2C Target In-System Programming Bootloader"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embassy-sync = { version = "0.6", default-features = false }
embassy-executor = { version = "0.7", default-features = false, features = ["task-arena-size-8192", "arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.4", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
embassy-rp = { version = "0.3", default-features = false, features = ["defmt", "time-driver", "critical-section-impl", "boot2-w25q080", "rp2040", "rt"] }
embedded-storage = { version = "0.3", default-features = false }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

[profile.release]
debug = 2
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"

[target.thumbv6m-none-eabi.dependencies]
rp2040-hal = { version = "0.12.0", default-features = false }
