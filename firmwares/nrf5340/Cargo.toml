[package]
name = "nrf5340"
version = "0.1.0"
edition = "2021"

[dependencies]
expressive-core = { path = "../../core" }

cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.3"
embassy-nrf = { version = "0.11.0", features = ["defmt", "nrf5340-app-s", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
