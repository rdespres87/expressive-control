[target.thumbv6m-none-eabi]
runner = "probe-rs run --chip RP2040"
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tlink-rp.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "link-arg=--undefined=USBCTRL_IRQ",
    "-C", "link-arg=--undefined=I2C0_IRQ",
    "-C", "link-arg=--undefined=TIMER_IRQ_0",
]

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "debug"
