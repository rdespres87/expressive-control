name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, Lint & Test (Host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # We add the embedded target to ensure the toolchain supports it later
          targets: thumbv8m.main-none-eabihf

      - name: Install System Dependencies (ALSA & Udev)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy -p expressive-core -p simulator -p instruments -- -D warnings

      - name: Run Unit Tests (Core & Simulator)
        run: cargo test -p expressive-core -p simulator -p instruments

  check-embedded:
    name: Verify no_std (Embedded Target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      - name: Check Core for nRF5340 (Cortex-M33)
        # This checks that expressive-core successfully compiles without the standard library
        run: cargo check -p expressive-core --target thumbv8m.main-none-eabihf
