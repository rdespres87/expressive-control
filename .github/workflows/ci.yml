name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, Lint & Test (Host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # We add the embedded target to ensure the toolchain supports it later
          targets: thumbv8m.main-none-eabihf

      - name: Install System Dependencies (ALSA, Udev, Fontconfig)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy -p expressive-core -p simulator -p theremin -- -D warnings

      - name: Run Unit Tests (Core & Simulator)
        run: cargo test -p expressive-core -p simulator -p theremin

  check-embedded:
    name: Verify no_std (Embedded Target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf

      - name: Check Core for nRF5340 (Cortex-M33)
        # This checks that expressive-core successfully compiles without the standard library
        run: cargo check -p expressive-core --target thumbv8m.main-none-eabihf

  build-firmware-esp32:
    name: Build Firmware (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ESP-IDF Dependencies
        run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Setup Rust ESP Toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Check ESP32-S3 Firmware
        run: cd firmwares/expressive-theremin && cargo clippy -- -D warnings

      - name: Build ESP32-S3 Firmware
        run: cd firmwares/expressive-theremin && cargo build --release
